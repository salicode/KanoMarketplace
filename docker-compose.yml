# docker-compose.yml
version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4   # PostGIS build — you'll want geo queries for rider distance
    environment:
      POSTGRES_DB: kano_marketplace
      POSTGRES_USER: kano_user
      POSTGRES_PASSWORD: devpassword
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: